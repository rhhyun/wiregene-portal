version: "3.3"

services:
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/rhhyun/wiregene-portal:latest}
    container_name: ${CONTAINER_NAME:-wiregene-portal}
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${HOST_PORT:-3002}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      WIREGENE_APP_MODE: portal
      PORT: "3000"
      REPORT_STORAGE_BACKEND: ${REPORT_STORAGE_BACKEND:-local-json}
      REPORT_STORAGE_LOCAL_PATH: ${REPORT_STORAGE_LOCAL_PATH:-.data/portal/research-briefing-storage.json}
      PORTAL_ACCOUNT_STORAGE_BACKEND: ${PORTAL_ACCOUNT_STORAGE_BACKEND:-local-json}
      PORTAL_ACCOUNT_STORAGE_PATH: ${PORTAL_ACCOUNT_STORAGE_PATH:-.data/portal/portal-accounts.json}
    volumes:
      - ./data:/app/.data/portal
      - ./logs:/app/.logs/portal
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
